<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창고 이동 결재 통제 | DDUK ERP</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/common/dashboard.css">
    <style>
        body { font-family: 'Outfit', 'Noto Sans KR', sans-serif; }
        .tab_btn { padding: 0.75rem 1.25rem; font-size: 0.875rem; font-weight: 600; transition: all 0.2s; border-bottom: 2px solid transparent; }
        .tab_btn.active { border-color: #4f46e5; color: #4f46e5; }
        .transfers_table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .transfers_table th { background: #f9fafb; padding: 1rem; text-align: left; font-size: 0.75rem; font-weight: 700; color: #4b5563; text-transform: uppercase; border-bottom: 1px solid #e5e7eb; }
        .transfers_table td { padding: 1rem; font-size: 0.875rem; color: #1f2937; border-bottom: 1px solid #f3f4f6; transition: background 0.15s; }
        .transfers_table tr:hover td { background: #f9fafb; }
        .status_badge { padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.25rem; }
        .status_PENDING { background: #fffbeb; color: #d97706; }
        .status_APPROVED { background: #eff6ff; color: #2563eb; }
        .status_COMPLETED { background: #ecfdf5; color: #059669; }
        .status_CANCELLED { background: #fef2f2; color: #dc2626; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <aside data-dduk-sidebar></aside>
    <div class="main_wrap">
        <header class="topbar px-6 py-4 bg-white border-b flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button id="mobile_menu_btn" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu"></i></button>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight flex items-center gap-2">
                    <i data-lucide="git-compare" class="w-6 h-6 text-indigo-600"></i> 창고 이동 결재 통제
                </h1>
            </div>
            <button id="open-request-modal" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold text-sm hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> 이동 요청 등록
            </button>
        </header>

        <main class="content_area p-6">
            <!-- Tabs -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                <div class="flex border-b border-gray-100 overflow-x-auto">
                    <button class="tab_btn active" data-status="">전체 이동 목록</button>
                    <button class="tab_btn" data-status="PENDING">승인대기</button>
                    <button class="tab_btn" data-status="APPROVED">이동중(승인)</button>
                    <button class="tab_btn" data-status="COMPLETED">이동완료</button>
                    <button class="tab_btn" data-status="CANCELLED">취소됨</button>
                </div>

                <!-- Table Area -->
                <div class="overflow-x-auto">
                    <table class="transfers_table">
                        <thead>
                            <tr>
                                <th>이동번호</th>
                                <th>출발 창고</th>
                                <th>도착 창고</th>
                                <th>품목 건수</th>
                                <th>등록자</th>
                                <th>승인자</th>
                                <th>일시</th>
                                <th>상태</th>
                                <th class="text-center">결재 조치</th>
                            </tr>
                        </thead>
                        <tbody id="transfer-list">
                            <!-- Data rows injected here -->
                        </tbody>
                    </table>
                    <div id="empty-state" class="hidden p-16 text-center text-gray-500">
                        <i data-lucide="inbox" class="w-16 h-16 mx-auto mb-4 opacity-20"></i>
                        <p class="text-lg font-semibold text-gray-600">창고 이동 내역이 존재하지 않습니다.</p>
                        <p class="text-sm text-gray-400">새로운 창고 이동 요청을 등록해 보세요.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Request Modal -->
    <div id="request-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden backdrop-blur-xs">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-8 shadow-2xl m-4 border border-gray-100 animate-in fade-in zoom-in-95 duration-200">
            <div class="flex justify-between items-center border-b pb-4 mb-6">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="plus-square" class="text-indigo-600"></i> 신규 창고 이동 요청</h3>
                <button id="close-request-modal" class="p-1.5 hover:bg-gray-100 rounded-lg text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">출고 창고 (Source)</label>
                        <select id="modal-from-warehouse" class="w-full p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                            <option value="">출발 창고 선택</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">입고 창고 (Destination)</label>
                        <select id="modal-to-warehouse" class="w-full p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                            <option value="">목적지 창고 선택</option>
                        </select>
                    </div>
                </div>

                <div class="bg-indigo-50 rounded-xl p-6 border border-indigo-100 space-y-4">
                    <h4 class="text-xs font-bold text-indigo-700 uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="package" class="w-4 h-4"></i> 이동 품목 설정
                    </h4>
                    <div class="grid grid-cols-12 gap-3 items-end">
                        <div class="col-span-6">
                            <label class="block text-xs font-bold text-gray-500 mb-1.5">품목 선택</label>
                            <select id="modal-item-select" disabled class="w-full p-3 border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="">출발 창고를 먼저 선택하세요</option>
                            </select>
                        </div>
                        <div class="col-span-3">
                            <label class="block text-xs font-bold text-gray-500 mb-1.5">이동 수량</label>
                            <input id="modal-transfer-qty" type="number" min="1" placeholder="0" class="w-full p-3 border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div class="col-span-3 text-right">
                            <span id="modal-available-info" class="text-xs font-bold text-indigo-600 block mb-3.5">가용재고: -</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">이동 사유 / 비고</label>
                    <textarea id="modal-remarks" rows="2" placeholder="창고 이동 긴급 사유 기입..." class="w-full p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3 border-t pt-4">
                <button id="cancel-modal" class="px-5 py-2.5 border rounded-xl font-bold text-sm text-gray-600 hover:bg-gray-50 transition-colors">취소</button>
                <button id="submit-request-btn" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold text-sm hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-100">요청 전송</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden backdrop-blur-xs">
        <div class="bg-white rounded-2xl max-w-xl w-full p-8 shadow-2xl m-4 border border-gray-100 animate-in fade-in zoom-in-95 duration-200">
            <div class="flex justify-between items-center border-b pb-4 mb-6">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="info" class="text-indigo-600"></i> 창고 이동 상세 정보</h3>
                <button id="close-detail-modal" class="p-1.5 hover:bg-gray-100 rounded-lg text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-6" id="detail-content">
                <!-- Data injected dynamically -->
            </div>
        </div>
    </div>

    <script src="../../services/inventory/inventory-service.js"></script>
    <script src="../../services/common/sidebar.js"></script>
    <script>
        let currentStatusFilter = '';
        let warehouses = [];

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await loadWarehouses();
            await loadTransfers();

            // Tab Event
            document.querySelectorAll('.tab_btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    document.querySelectorAll('.tab_btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentStatusFilter = e.target.dataset.status;
                    await loadTransfers();
                });
            });

            // Modal Trigger
            document.getElementById('open-request-modal').addEventListener('click', () => {
                document.getElementById('request-modal').classList.remove('hidden');
            });
            document.getElementById('close-request-modal').addEventListener('click', hideRequestModal);
            document.getElementById('cancel-modal').addEventListener('click', hideRequestModal);
            document.getElementById('close-detail-modal').addEventListener('click', () => {
                document.getElementById('detail-modal').classList.add('hidden');
            });

            document.getElementById('modal-from-warehouse').addEventListener('change', loadItemsInSourceWarehouse);
            document.getElementById('modal-item-select').addEventListener('change', updateAvailableInfo);
            document.getElementById('submit-request-btn').addEventListener('click', submitRequest);
        });

        function hideRequestModal() {
            document.getElementById('request-modal').classList.add('hidden');
            document.getElementById('modal-from-warehouse').value = '';
            document.getElementById('modal-to-warehouse').value = '';
            document.getElementById('modal-item-select').innerHTML = '<option value="">출발 창고를 먼저 선택하세요</option>';
            document.getElementById('modal-item-select').disabled = true;
            document.getElementById('modal-transfer-qty').value = '';
            document.getElementById('modal-available-info').textContent = '가용재고: -';
            document.getElementById('modal-remarks').value = '';
        }

        async function loadWarehouses() {
            try {
                const response = await InventoryService.getWarehouses();
                if (response.status === 'success') {
                    warehouses = response.data;
                    const fromWh = document.getElementById('modal-from-warehouse');
                    const toWh = document.getElementById('modal-to-warehouse');
                    
                    const options = warehouses.map(w => `<option value="${w.id}">${w.warehouseName}</option>`).join('');
                    fromWh.innerHTML = '<option value="">출발 창고 선택</option>' + options;
                    toWh.innerHTML = '<option value="">목적지 창고 선택</option>' + options;
                }
            } catch (error) {
                console.error('Failed to load warehouses:', error);
            }
        }

        async function loadItemsInSourceWarehouse() {
            const whId = document.getElementById('modal-from-warehouse').value;
            const itemSelect = document.getElementById('modal-item-select');
            if (!whId) {
                itemSelect.innerHTML = '<option value="">출발 창고를 먼저 선택하세요</option>';
                itemSelect.disabled = true;
                return;
            }

            try {
                const response = await InventoryService.getStocks({ warehouseId: whId });
                if (response.status === 'success') {
                    itemSelect.innerHTML = '<option value="">이동 품목 선택</option>' + 
                        response.data.map(i => `<option value="${i.item.id}" data-available="${i.currentStock - i.allocatedStock}">${i.item.name} (${i.item.itemCode})</option>`).join('');
                    itemSelect.disabled = false;
                }
            } catch (error) {
                console.error('Failed to load items in warehouse:', error);
            }
        }

        function updateAvailableInfo() {
            const select = document.getElementById('modal-item-select');
            const selected = select.options[select.selectedIndex];
            const available = selected.dataset.available || '-';
            document.getElementById('modal-available-info').textContent = `가용재고: ${available}`;
        }

        async function loadTransfers() {
            const list = document.getElementById('transfer-list');
            const empty = document.getElementById('empty-state');
            
            try {
                const params = {};
                if (currentStatusFilter) params.status = currentStatusFilter;
                
                const response = await InventoryService.getTransfers(params);
                if (response.status === 'success' && response.data.length > 0) {
                    list.innerHTML = response.data.map(t => {
                        return `
                            <tr>
                                <td>
                                    <button class="font-bold text-indigo-600 hover:underline" onclick="showDetail(${t.id})">
                                        ${t.transferNo}
                                    </button>
                                </td>
                                <td><span class="font-medium text-gray-700">${t.sourceWarehouseName}</span></td>
                                <td><span class="font-medium text-gray-700">${t.targetWarehouseName}</span></td>
                                <td class="font-semibold text-center">${t.items.length} 건</td>
                                <td class="text-gray-500">${t.requestedByName}</td>
                                <td class="text-gray-500">${t.approvedByName || '-'}</td>
                                <td class="text-xs text-gray-400">${new Date(t.createdAt).toLocaleString()}</td>
                                <td>
                                    <span class="status_badge status_${t.status}">
                                        ${getStatusText(t.status)}
                                    </span>
                                </td>
                                <td class="text-center flex justify-center gap-2">
                                    ${getActionButtons(t)}
                                </td>
                            </tr>
                        `;
                    }).join('');
                    list.parentElement.classList.remove('hidden');
                    empty.classList.add('hidden');
                } else {
                    list.innerHTML = '';
                    list.parentElement.classList.add('hidden');
                    empty.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Failed to load transfers:', error);
            }
        }

        function getStatusText(status) {
            if (status === 'PENDING') return '승인대기';
            if (status === 'APPROVED') return '이동중';
            if (status === 'COMPLETED') return '완료';
            if (status === 'CANCELLED') return '취소됨';
            return status;
        }

        function getActionButtons(t) {
            if (t.status === 'PENDING') {
                return `
                    <button onclick="approveTransfer(${t.id})" class="px-2.5 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition-colors">승인</button>
                    <button onclick="cancelTransfer(${t.id})" class="px-2.5 py-1.5 bg-red-100 text-red-600 rounded-lg text-xs font-bold hover:bg-red-200 transition-colors">반려</button>
                `;
            }
            if (t.status === 'APPROVED') {
                return `
                    <button onclick="completeTransfer(${t.id})" class="px-2.5 py-1.5 bg-green-600 text-white rounded-lg text-xs font-bold hover:bg-green-700 transition-colors">완료처리</button>
                    <button onclick="cancelTransfer(${t.id})" class="px-2.5 py-1.5 bg-gray-100 text-gray-500 rounded-lg text-xs font-bold hover:bg-gray-200 transition-colors">취소</button>
                `;
            }
            return '<span class="text-xs text-gray-400 font-semibold">-</span>';
        }

        async function submitRequest() {
            const fromWh = document.getElementById('modal-from-warehouse').value;
            const toWh = document.getElementById('modal-to-warehouse').value;
            const itemId = document.getElementById('modal-item-select').value;
            const qty = parseInt(document.getElementById('modal-transfer-qty').value);
            const remarks = document.getElementById('modal-remarks').value;

            if (!fromWh || !toWh || !itemId || !qty) {
                alert('모든 필수 항목을 기입하세요.');
                return;
            }

            if (fromWh === toWh) {
                alert('출발 창고와 목적지 창고가 동일합니다.');
                return;
            }

            try {
                const response = await InventoryService.requestTransfer({
                    sourceWarehouseId: fromWh,
                    targetWarehouseId: toWh,
                    remarks: remarks,
                    items: [{ itemId: itemId, quantity: qty }]
                });

                if (response.status === 'success') {
                    alert('창고 이동 요청이 성공적으로 등록되었습니다.');
                    hideRequestModal();
                    await loadTransfers();
                } else {
                    alert('오류: ' + response.message);
                }
            } catch (error) {
                alert('이동 요청에 실패하였습니다.');
            }
        }

        async function approveTransfer(id) {
            if (!confirm('해당 창고 이동 요청을 승인하시겠습니까?')) return;
            try {
                const res = await InventoryService.approveTransfer(id);
                if (res.status === 'success') {
                    alert('승인되었습니다.');
                    await loadTransfers();
                } else {
                    alert('실패: ' + res.message);
                }
            } catch (error) {
                alert('오류가 발생했습니다.');
            }
        }

        async function completeTransfer(id) {
            if (!confirm('이동 물품을 정상 수령하여 창고 이동을 최종 완료하시겠습니까?')) return;
            try {
                const res = await InventoryService.completeTransfer(id);
                if (res.status === 'success') {
                    alert('창고 이동이 정상 완료되어 재고가 최종 반영되었습니다.');
                    await loadTransfers();
                } else {
                    alert('완료 처리 실패: ' + res.message);
                }
            } catch (error) {
                alert('오류가 발생했습니다.');
            }
        }

        async function cancelTransfer(id) {
            if (!confirm('해당 창고 이동 요청을 반려 또는 취소하시겠습니까? (예약 재고가 해제됩니다)')) return;
            try {
                const res = await InventoryService.cancelTransfer(id);
                if (res.status === 'success') {
                    alert('취소 처리되었습니다.');
                    await loadTransfers();
                } else {
                    alert('취소 실패: ' + res.message);
                }
            } catch (error) {
                alert('오류가 발생했습니다.');
            }
        }

        async function showDetail(id) {
            try {
                const res = await InventoryService.getTransferDetail(id);
                if (res.status === 'success') {
                    const t = res.data;
                    const content = document.getElementById('detail-content');
                    content.innerHTML = `
                        <div class="grid grid-cols-2 gap-4 text-sm bg-gray-50 p-4 rounded-xl">
                            <div><p class="text-gray-400">이동 번호</p><p class="font-bold text-gray-800">${t.transferNo}</p></div>
                            <div><p class="text-gray-400">결재 상태</p><p class="font-bold status_badge status_${t.status} mt-1">${getStatusText(t.status)}</p></div>
                            <div><p class="text-gray-400">출발 창고</p><p class="font-semibold text-gray-700">${t.sourceWarehouseName}</p></div>
                            <div><p class="text-gray-400">목적지 창고</p><p class="font-semibold text-gray-700">${t.targetWarehouseName}</p></div>
                            <div><p class="text-gray-400">요청자</p><p class="text-gray-700">${t.requestedByName}</p></div>
                            <div><p class="text-gray-400">승인자</p><p class="text-gray-700">${t.approvedByName || '-'}</p></div>
                        </div>

                        <div>
                            <h4 class="font-bold text-gray-800 mb-2 border-b pb-1 text-sm"><i data-lucide="list" class="w-4 h-4 inline"></i> 이동 품목 목록</h4>
                            <div class="space-y-2">
                                ${t.items.map(item => `
                                    <div class="flex justify-between items-center p-3 bg-white border rounded-xl text-sm">
                                        <div>
                                            <p class="font-bold text-gray-800">${item.itemName}</p>
                                            <p class="text-xs text-gray-400">${item.itemCode}</p>
                                        </div>
                                        <p class="font-semibold text-indigo-600">${item.quantity.toLocaleString()} ${item.unit}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <h4 class="font-bold text-gray-800 mb-1 text-sm">이동 사유 / 비고</h4>
                            <p class="text-sm bg-gray-50 p-3 rounded-xl text-gray-600 border border-dashed">${t.remarks || '비고 사항 없음'}</p>
                        </div>

                        <div class="border-t pt-4 text-xs text-gray-400 space-y-1">
                            <p>요청 등록 일시: ${new Date(t.createdAt).toLocaleString()}</p>
                            ${t.approvedAt ? `<p>승인 처리 일시: ${new Date(t.approvedAt).toLocaleString()}</p>` : ''}
                            ${t.completedAt ? `<p>이동 완료 일시: ${new Date(t.completedAt).toLocaleString()}</p>` : ''}
                        </div>
                    `;
                    document.getElementById('detail-modal').classList.remove('hidden');
                    lucide.createIcons();
                }
            } catch (error) {
                alert('상세 정보를 불러올 수 없습니다.');
            }
        }
    </script>
</body>
</html>
