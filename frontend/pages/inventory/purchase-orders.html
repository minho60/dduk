<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발주조회 | DDUK ERP</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../../styles/common/dashboard.css">
    <style>
        .form-label{display:block;margin-bottom:.5rem;font-size:.875rem;font-weight:700;color:#374151}
        .form-input{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.75rem 1rem;font-size:.875rem;color:#111827;background:#fff}
        .form-input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
        .data-table{width:100%;border-collapse:separate;border-spacing:0}
        .data-table th{background:#f9fafb;padding:.75rem;text-align:left;font-size:.75rem;font-weight:800;color:#6b7280;border-bottom:1px solid #e5e7eb;white-space:nowrap}
        .data-table td{padding:.875rem .75rem;font-size:.875rem;color:#374151;border-bottom:1px solid #f3f4f6;vertical-align:top}
        .status-badge{display:inline-flex;align-items:center;border-radius:999px;padding:.25rem .625rem;font-size:.75rem;font-weight:800}
        .status-DRAFT{background:#f3f4f6;color:#374151}
        .status-ORDERED,.status-PENDING,.status-REQUESTED{background:#eef2ff;color:#4338ca}
        .status-APPROVED{background:#ecfdf5;color:#047857}
        .status-SENT_TO_VENDOR{background:#f0fdfa;color:#0f766e}
        .status-INBOUND_DELAY{background:#fff1f2;color:#be123c}
        .status-RECEIVING{background:#fff7ed;color:#c2410c}
        .status-RECEIVED,.status-COMPLETED{background:#eff6ff;color:#1d4ed8}
        .status-CANCELLED{background:#fef2f2;color:#b91c1c}
        .member-pill{display:inline-flex;align-items:center;gap:.375rem;border-radius:.5rem;background:#f8fafc;border:1px solid #e5e7eb;padding:.375rem .5rem;font-size:.75rem;font-weight:700;color:#334155}
        .approval-btn{display:inline-flex;align-items:center;justify-content:center;gap:.375rem;border-radius:.5rem;padding:.625rem .875rem;font-size:.8125rem;font-weight:800;white-space:nowrap}
        .action-cell{white-space:nowrap}
        .approval-btn:disabled{cursor:not-allowed;background:#f3f4f6;color:#9ca3af;border:1px solid #e5e7eb}
        .approval-btn:not(:disabled){background:#4f46e5;color:#fff}
        .approval-btn:not(:disabled):hover{background:#4338ca}
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <aside data-dduk-sidebar></aside>
    <div class="main_wrap">
        <header class="topbar px-6 py-4 flex justify-between items-center bg-white border-b sticky top-0 z-10">
            <div class="flex items-center gap-4">
                <button id="mobile_menu_btn" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu"></i></button>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">발주조회</h1>
                    <p class="text-sm text-gray-500 mt-1">발주번호, 거래처, 요청자로 검색합니다.</p>
                </div>
            </div>
            <div id="current-user" class="member-pill"></div>
        </header>
        <main class="content_area p-6 max-w-7xl mx-auto">
            <section class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden mb-6">
                <form id="search-form" class="p-5 grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_auto_auto] gap-3 items-end">
                    <label>
                        <span class="form-label">검색어</span>
                        <input id="keyword" class="form-input" placeholder="발주번호, 거래처명, 요청자명 또는 요청자 ID를 입력하세요" autocomplete="off" required>
                    </label>
                    <button type="submit" class="h-11 px-5 text-sm font-bold text-white bg-gray-900 rounded-lg hover:bg-gray-800 flex items-center justify-center gap-2">
                        <i data-lucide="search" class="w-4 h-4"></i> 검색
                    </button>
                    <button type="button" id="btn-all" class="h-11 px-5 text-sm font-bold rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 flex items-center justify-center gap-2">
                        <i data-lucide="list" class="w-4 h-4"></i> 전체 조회
                    </button>
                </form>
            </section>

            <section class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-5 border-b border-gray-100">
                    <h2 class="text-base font-bold text-gray-800">발주 목록</h2>
                    <p id="message" class="text-sm text-gray-500 mt-1">검색어를 입력한 뒤 조회하세요.</p>
                </div>
                <div class="overflow-x-auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>발주번호</th>
                                <th>거래처 / 품목</th>
                                <th>요청자</th>
                                <th>승인 필요</th>
                                <th>금액 / 일정</th>
                                <th>상태</th>
                                <th>승인</th>
                            </tr>
                        </thead>
                        <tbody id="orders-body">
                            <tr><td colspan="7" class="text-center text-gray-400 font-semibold py-8">검색 전에는 목록을 조회하지 않습니다.</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-5 flex justify-center border-t border-gray-100">
                    <button type="button" id="btn-more" class="hidden px-5 py-2.5 text-sm font-bold rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50">더보기</button>
                </div>
            </section>
        </main>
    </div>
    <script src="../../services/common/session.js"></script>
    <script src="../../services/common/sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = window.ddukSession?.requireRole?.(['ADMIN', 'INVENTORY', 'HR'], { redirectToLogin: true });
            if (!session) return;
            if (window.lucide) lucide.createIcons();

            const apiOrigin = location.protocol === 'file:' ? 'http://localhost:8080' : location.origin;
            const body = document.getElementById('orders-body');
            const message = document.getElementById('message');
            const moreButton = document.getElementById('btn-more');
            const searchForm = document.getElementById('search-form');
            const keywordInput = document.getElementById('keyword');
            const allButton = document.getElementById('btn-all');
            const currentUser = document.getElementById('current-user');
            const pageSize = 15;
            let orders = [];
            let visibleCount = pageSize;

            const memberProfiles = {
                1: { loginId: 'admin', label: '최고관리자' },
                2: { loginId: 'inventory', label: '구매/발주 담당' },
                3: { loginId: 'hr', label: '회계/직원 관리 담당' }
            };

            function resolveCurrentMemberId() {
                const loginId = (localStorage.getItem('loginId') || '').toLowerCase();
                const role = (localStorage.getItem('role') || '').toUpperCase();
                if (loginId === 'admin' || role === 'ADMIN') return 1;
                if (loginId === 'inventory' || role === 'INVENTORY') return 2;
                if (loginId === 'hr' || role === 'HR') return 3;
                const stored = localStorage.getItem('memberId') || localStorage.getItem('userId');
                if (stored) return Number(stored);
                return null;
            }

            const currentMemberId = resolveCurrentMemberId();
            const isAdmin = (session.role || localStorage.getItem('role') || '').toUpperCase() === 'ADMIN';
            currentUser.textContent = `현재 로그인: ${memberText(currentMemberId, session.userName)}`;

            function headers(json) {
                const token = localStorage.getItem('token');
                const result = json ? { 'Content-Type': 'application/json' } : {};
                if (token) result.Authorization = `Bearer ${token}`;
                return result;
            }

            function setMessage(text, type) {
                const color = type === 'error' ? 'text-red-600' : type === 'ok' ? 'text-emerald-600' : 'text-gray-500';
                message.className = `text-sm mt-1 font-semibold ${color}`;
                message.textContent = text;
            }

            async function readError(response) {
                const text = await response.text();
                if (!text) return `HTTP ${response.status}`;
                try {
                    const parsed = JSON.parse(text);
                    return parsed.message || parsed.error || text;
                } catch {
                    return text;
                }
            }

            function escapeHtml(value) {
                return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
            }

            function money(value) {
                return Number(value || 0).toLocaleString('ko-KR', { style: 'currency', currency: 'KRW', maximumFractionDigits: 0 });
            }

            function dateText(value) {
                return value ? String(value).slice(0, 10) : '-';
            }

            function memberText(id, name) {
                const profile = memberProfiles[Number(id)];
                if (!profile) return name || `ID ${id || '-'}`;
                return `${profile.label} (${profile.loginId}/${id})`;
            }

            function statusText(status) {
                return {
                    DRAFT: '초안',
                    ORDERED: '발주요청',
                    PENDING: '발주요청',
                    REQUESTED: '발주요청',
                    APPROVED: '승인 완료',
                    SENT_TO_VENDOR: '거래처 발송',
                    INBOUND_DELAY: '입고지연',
                    RECEIVING: '입고중',
                    RECEIVED: '입고 완료',
                    COMPLETED: '발주완료',
                    CANCELLED: '취소'
                }[status] || status || '-';
            }

            function itemSummary(order) {
                const items = order.items || [];
                if (items.length === 0) return '품목 없음';
                const names = items.slice(0, 2).map(item => item.itemName || item.name || `품목 ${item.itemId}`).join(', ');
                return items.length > 2 ? `${names} 외 ${items.length - 2}건` : names;
            }

            function canApprove(order) {
                return isAdmin && ['ORDERED', 'PENDING', 'REQUESTED'].includes(order.status);
            }

            function approveTitle(order) {
                if (order.status === 'APPROVED') return '이미 승인된 발주입니다.';
                if (!['ORDERED', 'PENDING', 'REQUESTED'].includes(order.status)) return '발주요청 상태에서만 승인할 수 있습니다.';
                if (!isAdmin) return '관리자만 발주를 승인할 수 있습니다.';
                return '승인 처리';
            }

            function render() {
                const visibleOrders = orders.slice(0, visibleCount);
                if (visibleOrders.length === 0) {
                    body.innerHTML = '<tr><td colspan="7" class="text-center text-gray-400 font-semibold py-8">조회된 발주가 없습니다.</td></tr>';
                } else {
                    body.innerHTML = visibleOrders.map(order => `
                        <tr>
                            <td>
                                <a class="font-extrabold text-indigo-700 hover:text-indigo-900 hover:underline" href="purchase-order-detail.html?id=${encodeURIComponent(order.purchaseOrderId)}">${escapeHtml(order.purchaseOrderNo || '-')}</a>
                                <p class="text-xs text-gray-400 mt-1">ID ${escapeHtml(order.purchaseOrderId || '-')}</p>
                            </td>
                            <td>
                                <p class="font-bold text-gray-800">${escapeHtml(order.vendorName || '-')}</p>
                                <p class="text-xs text-gray-500 mt-1">${escapeHtml(itemSummary(order))}</p>
                            </td>
                            <td><span class="member-pill">${escapeHtml(memberText(order.requestedByMemberId, order.requestedByMemberName))}</span></td>
                            <td><span class="member-pill">${escapeHtml(memberText(order.approvedByMemberId, order.approvedByMemberName))}</span></td>
                            <td>
                                <p class="font-bold text-gray-900">${money(order.totalAmount)}</p>
                                <p class="text-xs text-gray-500 mt-1">요청 ${dateText(order.orderDate)} / 납기 ${dateText(order.expectedDate)}</p>
                            </td>
                            <td><span class="status-badge status-${escapeHtml(order.status)}">${escapeHtml(statusText(order.status))}</span></td>
                            <td class="action-cell">
                                <button type="button" class="approval-btn" data-id="${escapeHtml(order.purchaseOrderId)}" ${canApprove(order) ? '' : 'disabled'} title="${escapeHtml(approveTitle(order))}">
                                    <i data-lucide="check-circle" class="w-4 h-4"></i> 승인
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }

                moreButton.classList.toggle('hidden', visibleCount >= orders.length);
                document.querySelectorAll('.approval-btn[data-id]').forEach(button => {
                    button.addEventListener('click', () => approveOrder(Number(button.dataset.id)));
                });
                if (window.lucide) lucide.createIcons();
            }

            async function searchOrders() {
                const keyword = keywordInput.value.trim();
                if (!keyword) {
                    orders = [];
                    visibleCount = pageSize;
                    body.innerHTML = '<tr><td colspan="7" class="text-center text-gray-400 font-semibold py-8">검색어를 입력해야 조회할 수 있습니다.</td></tr>';
                    moreButton.classList.add('hidden');
                    setMessage('검색어를 입력해 주세요.', 'error');
                    keywordInput.focus();
                    return;
                }

                body.innerHTML = '<tr><td colspan="7" class="text-center text-gray-400 font-semibold py-8">검색 중입니다.</td></tr>';
                moreButton.classList.add('hidden');
                setMessage('검색 중입니다.');
                try {
                    const url = new URL(`${apiOrigin}/api/v1/inventory/purchase-orders`);
                    url.searchParams.set('keyword', keyword);
                    const response = await fetch(url, { headers: headers(false) });
                    if (!response.ok) throw new Error(await readError(response));
                    orders = await response.json();
                    visibleCount = pageSize;
                    setMessage(`검색 결과 ${orders.length}건 중 ${Math.min(visibleCount, orders.length)}건을 표시합니다.`, 'ok');
                    render();
                } catch (error) {
                    orders = [];
                    body.innerHTML = `<tr><td colspan="7" class="text-center text-red-600 font-semibold py-8">발주 검색 실패: ${escapeHtml(error.message)}</td></tr>`;
                    setMessage(`발주 검색 실패: ${error.message}`, 'error');
                }
            }

            async function loadAllOrders() {
                keywordInput.value = '';
                body.innerHTML = '<tr><td colspan="7" class="text-center text-gray-400 font-semibold py-8">전체 발주 목록을 조회 중입니다.</td></tr>';
                moreButton.classList.add('hidden');
                setMessage('전체 발주 목록을 조회 중입니다.');
                try {
                    const url = new URL(`${apiOrigin}/api/v1/inventory/purchase-orders`);
                    url.searchParams.set('all', 'true');
                    const response = await fetch(url, { headers: headers(false) });
                    if (!response.ok) throw new Error(await readError(response));
                    orders = await response.json();
                    visibleCount = pageSize;
                    setMessage(`전체 ${orders.length}건 중 ${Math.min(visibleCount, orders.length)}건을 표시합니다.`, 'ok');
                    render();
                } catch (error) {
                    orders = [];
                    body.innerHTML = `<tr><td colspan="7" class="text-center text-red-600 font-semibold py-8">전체 발주 조회 실패: ${escapeHtml(error.message)}</td></tr>`;
                    setMessage(`전체 발주 조회 실패: ${error.message}`, 'error');
                }
            }

            async function approveOrder(orderId) {
                const order = orders.find(item => Number(item.purchaseOrderId) === Number(orderId));
                if (!order) return;
                if (!canApprove(order)) {
                    setMessage(approveTitle(order), 'error');
                    return;
                }

                setMessage(`${order.purchaseOrderNo} 승인 처리 중입니다.`);
                try {
                    const response = await fetch(`${apiOrigin}/api/v1/inventory/purchase-orders/${orderId}/status`, {
                        method: 'PATCH',
                        headers: headers(true),
                        body: JSON.stringify({ status: 'APPROVED' })
                    });
                    if (!response.ok) throw new Error(await readError(response));
                    const updated = await response.json();
                    orders = orders.filter(item => Number(item.purchaseOrderId) !== Number(orderId));
                    setMessage(`${updated.purchaseOrderNo || order.purchaseOrderNo} 승인 완료되었습니다.`, 'ok');
                    render();
                } catch (error) {
                    setMessage(`승인 실패: ${error.message}`, 'error');
                }
            }

            searchForm.addEventListener('submit', event => {
                event.preventDefault();
                searchOrders();
            });
            allButton.addEventListener('click', loadAllOrders);
            moreButton.addEventListener('click', () => {
                visibleCount += pageSize;
                setMessage(`검색 결과 ${orders.length}건 중 ${Math.min(visibleCount, orders.length)}건을 표시합니다.`, 'ok');
                render();
            });
        });
    </script>
</body>
</html>
