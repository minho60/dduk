<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고 입출고 원장 | DDUK ERP</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/common/dashboard.css">
    <style>
        .ledger_table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .ledger_table th { background: #f9fafb; padding: 1rem; text-align: left; font-size: 0.75rem; font-weight: 600; color: #6b7280; text-transform: uppercase; border-bottom: 1px solid #e5e7eb; }
        .ledger_table td { padding: 1rem; font-size: 0.875rem; color: #374151; border-bottom: 1px solid #f3f4f6; }
        .type_badge { padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .type_inbound { background: #ecfdf5; color: #059669; }
        .type_outbound { background: #fef2f2; color: #dc2626; }
        .type_transfer { background: #eff6ff; color: #2563eb; }
        .type_adjustment { background: #fff7ed; color: #ea580c; }
        .ref_no { font-family: monospace; color: #2563eb; font-weight: 600; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <aside data-dduk-sidebar></aside>
    <div class="main_wrap">
        <header class="topbar px-6 py-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white border-b">
            <div class="flex items-center gap-4">
                <button id="mobile_menu_btn" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu"></i></button>
                <h1 class="text-xl font-bold text-gray-800">재고 거래 원장</h1>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <div class="flex items-center gap-1.5">
                    <span class="text-xs text-gray-500 font-bold">기간:</span>
                    <input type="date" id="start-date" class="p-2 border rounded-lg text-xs bg-white focus:outline-indigo-500">
                    <span class="text-xs text-gray-500 font-bold">~</span>
                    <input type="date" id="end-date" class="p-2 border rounded-lg text-xs bg-white focus:outline-indigo-500">
                </div>
                <select id="warehouse-filter" class="p-2 border rounded-lg text-xs bg-white focus:outline-indigo-500">
                    <option value="">모든 창고</option>
                </select>
                <select id="type-filter" class="p-2 border rounded-lg text-xs bg-white focus:outline-indigo-500">
                    <option value="">모든 유형</option>
                    <option value="INBOUND">입고(IN)</option>
                    <option value="OUTBOUND">출고(OUT)</option>
                    <option value="TRANSFER_IN">창고입고(TR-IN)</option>
                    <option value="TRANSFER_OUT">창고출고(TR-OUT)</option>
                    <option value="ADJUSTMENT_IN">조정입고(ADJ-IN)</option>
                    <option value="ADJUSTMENT_OUT">조정출고(ADJ-OUT)</option>
                </select>
                <button id="excel-btn" class="px-3 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs font-bold shadow-xs flex items-center gap-1"><i data-lucide="download" class="w-3.5 h-3.5"></i> Excel</button>
                <button id="csv-btn" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold shadow-xs flex items-center gap-1"><i data-lucide="file-text" class="w-3.5 h-3.5"></i> CSV</button>
            </div>
        </header>

        <main class="content_area p-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="ledger_table">
                        <thead>
                            <tr>
                                <th>일시</th>
                                <th>참조번호</th>
                                <th>유형</th>
                                <th>품목</th>
                                <th>창고</th>
                                <th>수량</th>
                                <th>단가</th>
                                <th>총액</th>
                                <th>비고(사유)</th>
                            </tr>
                        </thead>
                        <tbody id="movement-list">
                            <!-- Data rows -->
                        </tbody>
                    </table>
                </div>
                <div id="empty-state" class="hidden p-16 text-center text-gray-500">
                    <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                    <p class="font-bold text-gray-600">거래 내역이 존재하지 않습니다.</p>
                    <p class="text-xs text-gray-400 mt-1">필터 조건을 재조정하거나 신규 이동/수불을 등록해 보세요.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../../services/common/apiClient.js"></script>
    <script src="../../services/inventory/inventory-service.js"></script>
    <script src="../../services/common/sidebar.js"></script>
    <script>
        let rawMovementsData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await loadWarehouses();
            await loadMovements();
            
            document.getElementById('warehouse-filter').addEventListener('change', loadMovements);
            document.getElementById('type-filter').addEventListener('change', loadMovements);
            document.getElementById('start-date').addEventListener('change', loadMovements);
            document.getElementById('end-date').addEventListener('change', loadMovements);
            document.getElementById('excel-btn').addEventListener('click', downloadExcel);
            document.getElementById('csv-btn').addEventListener('click', downloadCSV);
        });

        async function loadWarehouses() {
            try {
                const response = await InventoryService.getWarehouses();
                if (response.status === 'success') {
                    const filter = document.getElementById('warehouse-filter');
                    const options = response.data.map(w => `<option value="${w.id}">${w.warehouseName}</option>`).join('');
                    filter.innerHTML = '<option value="">모든 창고</option>' + options;
                }
            } catch (error) {
                console.error('Failed to load warehouses:', error);
            }
        }

        async function loadMovements() {
            const warehouseId = document.getElementById('warehouse-filter').value;
            const movementType = document.getElementById('type-filter').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const list = document.getElementById('movement-list');
            const empty = document.getElementById('empty-state');

            // 로딩 표시
            list.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:2.5rem;color:#6366f1;font-size:0.85rem;font-weight:600">🔄 거래 원장 로딩 중...</td></tr>`;
            empty.classList.add('hidden');
            
            try {
                const response = await InventoryService.getMovements({ warehouseId, movementType });
                
                if (response.status === 'success' && response.data.length > 0) {
                    rawMovementsData = response.data;
                    
                    // 기간(Date-Range) 필터링
                    let data = rawMovementsData;
                    if (startDate) {
                        data = data.filter(m => new Date(m.createdAt) >= new Date(startDate + 'T00:00:00'));
                    }
                    if (endDate) {
                        data = data.filter(m => new Date(m.createdAt) <= new Date(endDate + 'T23:59:59'));
                    }

                    if (data.length > 0) {
                        list.innerHTML = data.map(m => `
                            <tr>
                                <td class="text-xs text-gray-500">${new Date(m.createdAt).toLocaleString()}</td>
                                <td><span class="ref_no">${m.referenceNo || '-'}</span></td>
                                <td><span class="type_badge ${getTypeClass(m.movementType)}">${translateType(m.movementType)}</span></td>
                                <td>
                                    <p class="font-bold text-gray-800">${m.item.name}</p>
                                    <p class="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">${m.item.itemCode}</p>
                                </td>
                                <td><span class="text-xs font-semibold text-gray-600 bg-gray-100 px-2 py-1 rounded">${m.warehouse.warehouseName}</span></td>
                                <td class="font-bold ${m.movementType.includes('OUT') ? 'text-red-600' : 'text-green-600'}">
                                    ${m.movementType.includes('OUT') ? '-' : '+'}${m.quantity.toLocaleString()}
                                </td>
                                <td class="text-xs text-gray-500 font-medium">₩${(m.unitCost || 0).toLocaleString()}</td>
                                <td class="text-sm font-extrabold text-gray-800">₩${(m.totalAmount || 0).toLocaleString()}</td>
                                <td>
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-xs px-2 py-0.5 bg-indigo-50 text-indigo-700 font-bold rounded">${translateReason(m.movementReason)}</span>
                                        ${m.referenceType ? `<span class="text-[10px] text-gray-400 font-semibold">(${m.referenceType})</span>` : ''}
                                    </div>
                                </td>
                            </tr>
                        `).join('');
                        list.parentElement.classList.remove('hidden');
                        empty.classList.add('hidden');
                    } else {
                        list.innerHTML = '';
                        list.parentElement.classList.add('hidden');
                        empty.classList.remove('hidden');
                    }
                } else {
                    list.innerHTML = '';
                    list.parentElement.classList.add('hidden');
                    empty.classList.remove('hidden');
                }
                lucide.createIcons();
            } catch (error) {
                const list = document.getElementById('movement-list');
                const empty = document.getElementById('empty-state');
                const isUnauthorized = error && (error.type === 'unauthorized' || error.status === 401);
                const isNetwork = error && error.type === 'network';
                const msg = isNetwork ? '네트워크 오류: 서버에 연결할 수 없습니다.' : (isUnauthorized ? '로그인 후 이용하세요.' : '거래 원장 데이터 로드 실패.');
                list.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:3rem;color:#ef4444;font-size:0.85rem;font-weight:600">🔥 ${msg}</td></tr>`;
                empty.classList.add('hidden');
                if (!isUnauthorized && window.ddukApi && window.ddukApi.showToast) {
                    window.ddukApi.showToast(msg, isNetwork ? 'warning' : 'error');
                }
            }
        }

        function getTypeClass(type) {
            if (!type) return 'bg-gray-100 text-gray-600';
            if (type === 'INBOUND') return 'type_inbound';
            if (type === 'OUTBOUND') return 'type_outbound';
            if (type.startsWith('TRANSFER')) return 'type_transfer';
            if (type.startsWith('ADJUSTMENT')) return 'type_adjustment';
            if (type.startsWith('RETURN')) return 'type_transfer';
            return 'bg-gray-100 text-gray-600';
        }

        function translateType(type) {
            const map = {
                'INBOUND': '입고',
                'OUTBOUND': '출고',
                'TRANSFER_IN': '이동입고',
                'TRANSFER_OUT': '이동출고',
                'ADJUSTMENT_IN': '재고조정+',
                'ADJUSTMENT_OUT': '재고조정-',
                'RETURN_IN': '반품입고',
                'RETURN_OUT': '반품출고'
            };
            return map[type] || (type || '-');
        }

        function translateReason(reason) {
            const map = {
                'PURCHASE_RECEIVED': '구매입고',
                'SALES_SHIPPED': '매출출고',
                'TRANSFER': '창고이동',
                'MANUAL_ADJUST': '수동조정',
                'INITIAL': '초기재고'
            };
            return map[reason] || (reason || '-');
        }

        function getFilteredData() {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            let data = rawMovementsData;
            if (startDate) {
                data = data.filter(m => new Date(m.createdAt) >= new Date(startDate + 'T00:00:00'));
            }
            if (endDate) {
                data = data.filter(m => new Date(m.createdAt) <= new Date(endDate + 'T23:59:59'));
            }
            return data;
        }

        function downloadExcel() {
            const data = getFilteredData();
            if (data.length === 0) {
                alert('다운로드할 데이터가 없습니다.');
                return;
            }

            const formatted = data.map(m => ({
                '일시': new Date(m.createdAt).toLocaleString(),
                '참조번호': m.referenceNo || '-',
                '유형': m.movementType,
                '품목코드': m.item.itemCode,
                '품목명': m.item.name,
                '창고': m.warehouse.warehouseName,
                '변동수량': m.movementType.includes('OUT') ? -m.quantity : m.quantity,
                '단가': m.unitCost,
                '총액': m.totalAmount,
                '사유': translateReason(m.movementReason)
            }));

            const worksheet = XLSX.utils.json_to_sheet(formatted);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "입출고 원장");
            
            const today = new Date().toISOString().split('T')[0];
            XLSX.writeFile(workbook, `inventory_movements_${today}.xlsx`);
        }

        function downloadCSV() {
            const data = getFilteredData();
            if (data.length === 0) {
                alert('다운로드할 데이터가 없습니다.');
                return;
            }

            const headers = ['일시', '참조번호', '유형', '품목코드', '품목명', '창고', '변동수량', '단가', '총액', '사유'];
            const rows = data.map(m => [
                new Date(m.createdAt).toLocaleString(),
                m.referenceNo || '-',
                m.movementType,
                m.item.itemCode,
                `"${m.item.name.replace(/"/g, '""')}"`,
                m.warehouse.warehouseName,
                m.movementType.includes('OUT') ? -m.quantity : m.quantity,
                m.unitCost,
                m.totalAmount,
                translateReason(m.movementReason)
            ]);

            const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            const today = new Date().toISOString().split('T')[0];
            link.setAttribute("href", url);
            link.setAttribute("download", `inventory_movements_${today}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
