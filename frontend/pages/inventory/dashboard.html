<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고 대시보드 | DDUK ERP</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/common/dashboard.css">
    <style>
        body { font-family: 'Outfit', 'Noto Sans KR', sans-serif; }
        .kpi_grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
        .kpi_card { background: white; padding: 1.5rem; border-radius: 1.25rem; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); border: 1px solid #f3f4f6; transition: all 0.2s; }
        .kpi_card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px -2px rgba(0, 0, 0, 0.08); }
        .kpi_label { color: #6b7280; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .kpi_value { font-size: 1.75rem; font-weight: 800; color: #111827; }
        .kpi_trend { font-size: 0.75rem; margin-top: 0.5rem; display: flex; align-items: center; gap: 0.25rem; }
        .trend_up { color: #10b981; font-weight: 600; }
        .trend_down { color: #ef4444; font-weight: 600; }
        .section_grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        .section_card { background: white; padding: 1.75rem; border-radius: 1.25rem; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); border: 1px solid #f3f4f6; }
        .section_title { font-size: 1.1rem; font-weight: 700; color: #1f2937; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-b: 1px solid #f3f4f6; padding-bottom: 0.75rem; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <aside data-dduk-sidebar></aside>
    <div class="main_wrap">
        <header class="topbar px-6 py-4 flex justify-between items-center bg-white border-b">
            <div class="flex items-center gap-4">
                <button id="mobile_menu_btn" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu"></i></button>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight flex items-center gap-2">
                    <i data-lucide="layout-dashboard" class="w-6 h-6 text-indigo-600"></i> 재고관리 대시보드
                </h1>
            </div>
            <div class="flex items-center gap-3">
                <button class="p-2 hover:bg-gray-100 rounded-lg text-gray-400 relative"><i data-lucide="bell" class="w-5 h-5"></i><span class="absolute top-1 right-1 w-2 h-2 bg-indigo-600 rounded-full"></span></button>
                <button class="p-2 hover:bg-gray-100 rounded-lg text-gray-400"><i data-lucide="user" class="w-5 h-5"></i></button>
            </div>
        </header>

        <main class="content_area p-6 space-y-6">
            <!-- KPI Section (5 Cards) -->
            <div id="kpi-container" class="kpi_grid">
                <div class="kpi_card">
                    <p class="kpi_label">총 재고 수량</p>
                    <p id="total-qty" class="kpi_value text-indigo-600">0</p>
                    <p class="kpi_trend trend_up"><i data-lucide="trending-up" class="w-4 h-4"></i> 실시간 재고 집계</p>
                </div>
                <div class="kpi_card">
                    <p class="kpi_label">총 재고 자산 가치</p>
                    <p id="total-value" class="kpi_value text-indigo-600">₩0</p>
                    <p class="kpi_trend trend_up"><i data-lucide="trending-up" class="w-4 h-4"></i> 이동평균가 총합</p>
                </div>
                <div class="kpi_card">
                    <p class="kpi_label">부족 품목 (안전재고 하회)</p>
                    <p id="low-stock-count" class="kpi_value text-red-500">0</p>
                    <p class="kpi_trend text-red-500 font-semibold"><i data-lucide="alert-triangle" class="w-4 h-4"></i> 즉시 조치 요망</p>
                </div>
                <div class="kpi_card">
                    <p class="kpi_label">이동 대기 (결재 필요)</p>
                    <p id="pending-transfer-count" class="kpi_value text-amber-500">0</p>
                    <p class="kpi_trend text-amber-500 font-semibold"><i data-lucide="git-compare" class="w-4 h-4"></i> 결재 승인대기</p>
                </div>
                <div class="kpi_card">
                    <p class="kpi_label">최근 30일 출고량</p>
                    <p id="outbound-volume" class="kpi_value text-indigo-600">0</p>
                    <p class="kpi_trend trend_down"><i data-lucide="trending-down" class="w-4 h-4"></i> 원장 로그 누적치</p>
                </div>
            </div>

            <!-- Visualization Row -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-xs lg:col-span-2">
                    <h3 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-1.5"><i data-lucide="trending-up" class="w-4 h-4 text-indigo-500"></i> 최근 30일 입출고 변동 추이</h3>
                    <div class="h-56 relative"><canvas id="outbound-trend-chart"></canvas></div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-xs">
                    <h3 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-1.5"><i data-lucide="pie-chart" class="w-4 h-4 text-indigo-500"></i> 자산 가치별 창고 비중</h3>
                    <div class="h-56 relative"><canvas id="asset-ratio-chart"></canvas></div>
                </div>
            </div>

            <div class="section_grid">
                <!-- Left Column: Distribution & Pending Approvals -->
                <div class="space-y-6">
                    <!-- Warehouse Distribution -->
                    <div class="section_card">
                        <h3 class="section_title"><i data-lucide="pie-chart" class="w-5 h-5 text-indigo-500"></i> 창고별 재고 현황</h3>
                        <div id="distribution-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- JS handles injection -->
                        </div>
                    </div>

                    <!-- Pending Approval Widget (Direct Actionable UI) -->
                    <div class="section_card">
                        <h3 class="section_title flex justify-between items-center">
                            <span class="flex items-center gap-2"><i data-lucide="shield-alert" class="w-5 h-5 text-amber-500"></i> 결재 대기 중인 이동 요청</span>
                            <button onclick="location.href='transfers.html'" class="text-xs text-indigo-600 font-bold hover:underline flex items-center gap-1">전체 보기 <i data-lucide="chevron-right" class="w-3 h-3"></i></button>
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead>
                                    <tr class="text-gray-400 border-b">
                                        <th class="pb-2 font-semibold">이동 번호</th>
                                        <th class="pb-2 font-semibold">이동 경로</th>
                                        <th class="pb-2 font-semibold">요청자</th>
                                        <th class="pb-2 font-semibold text-center">결재</th>
                                    </tr>
                                </thead>
                                <tbody id="pending-transfer-list">
                                    <!-- Injected by JS -->
                                </tbody>
                            </table>
                            <div id="pending-empty" class="hidden py-8 text-center text-gray-400">
                                <i data-lucide="check-circle" class="w-8 h-8 text-green-500 mx-auto mb-2 opacity-50"></i>
                                <p class="text-xs font-semibold">결재 대기 중인 창고 이동이 없습니다.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Quick Actions & Recent Activities -->
                <div class="space-y-6">
                    <!-- Quick Actions -->
                    <div class="section_card">
                        <h3 class="section_title"><i data-lucide="zap" class="w-5 h-5 text-yellow-500"></i> 빠른 작업</h3>
                        <div class="grid grid-cols-1 gap-3">
                            <button onclick="location.href='list.html'" class="flex items-center gap-3 p-3 bg-gray-50 hover:bg-indigo-50 rounded-xl transition-all text-left group">
                                <div class="p-2.5 bg-indigo-100 text-indigo-600 rounded-lg group-hover:scale-105 transition-all"><i data-lucide="package" class="w-5 h-5"></i></div>
                                <div>
                                    <p class="font-bold text-gray-800 text-sm">재고 현황 조회</p>
                                    <p class="text-xs text-gray-500">전체 품목 및 창고별 재고 확인</p>
                                </div>
                            </button>
                            <button onclick="location.href='transfers.html'" class="flex items-center gap-3 p-3 bg-gray-50 hover:bg-green-50 rounded-xl transition-all text-left group">
                                <div class="p-2.5 bg-green-100 text-green-600 rounded-lg group-hover:scale-105 transition-all"><i data-lucide="move" class="w-5 h-5"></i></div>
                                <div>
                                    <p class="font-bold text-gray-800 text-sm">창고 이동 결재</p>
                                    <p class="text-xs text-gray-500">창고 간 재고 이동 결재/통제</p>
                                </div>
                            </button>
                            <button onclick="location.href='reorder.html'" class="flex items-center gap-3 p-3 bg-gray-50 hover:bg-orange-50 rounded-xl transition-all text-left group">
                                <div class="p-2.5 bg-orange-100 text-orange-600 rounded-lg group-hover:scale-105 transition-all"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
                                <div>
                                    <p class="font-bold text-gray-800 text-sm">자동 발주 추천</p>
                                    <p class="text-xs text-gray-500">부족 재고 확인 및 발주 추천</p>
                                </div>
                            </button>
                            <button onclick="location.href='movements.html'" class="flex items-center gap-3 p-3 bg-gray-50 hover:bg-blue-50 rounded-xl transition-all text-left group">
                                <div class="p-2.5 bg-blue-100 text-blue-600 rounded-lg group-hover:scale-105 transition-all"><i data-lucide="history" class="w-5 h-5"></i></div>
                                <div>
                                    <p class="font-bold text-gray-800 text-sm">재고 변동 원장</p>
                                    <p class="text-xs text-gray-500">모든 재고 변동 내역 추적</p>
                                </div>
                            </button>
                        </div>
                    </div>

                    <!-- Recent Activities Widget -->
                    <div class="section_card">
                        <h3 class="section_title"><i data-lucide="history" class="w-5 h-5 text-indigo-500"></i> 최근 재고 변동 이력</h3>
                        <div id="recent-movements" class="space-y-3.5">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../services/common/apiClient.js"></script>
    <script src="../../services/inventory/inventory-service.js"></script>
    <script src="../../services/common/sidebar.js"></script>
    <script>
        let assetChartInstance = null;
        let trendChartInstance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await loadStats();
            await loadPendingTransfers();
        });

        async function loadStats() {
            // KPI 카드 로딩 상태 표시
            ['total-qty','total-value','low-stock-count','pending-transfer-count','outbound-volume'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = '...';
            });
            try {
                const response = await InventoryService.getDashboardStats();
                if (response && response.status === 'success') {
                    const stats = response.data;
                    document.getElementById('total-qty').textContent = (stats.totalQuantity || 0).toLocaleString();
                    document.getElementById('total-value').textContent = '₩' + (stats.totalValue || 0).toLocaleString();
                    document.getElementById('low-stock-count').textContent = stats.lowStockCount || 0;
                    document.getElementById('pending-transfer-count').textContent = stats.pendingTransferCount || 0;
                    document.getElementById('outbound-volume').textContent = (stats.outboundVolume30Days || 0).toLocaleString();

                    // 1. Warehouse Distribution List
                    const distList = document.getElementById('distribution-list');
                    distList.innerHTML = stats.warehouseDistribution.map(item => `
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border border-gray-100 transition-all hover:bg-indigo-50">
                            <div class="flex items-center gap-3">
                                <div class="w-2.5 h-10 bg-indigo-500 rounded-full"></div>
                                <div>
                                    <p class="font-bold text-gray-800 text-sm">${item.warehouseName}</p>
                                    <p class="text-xs text-gray-400">보유 자산: ₩${(item.totalValue || 0).toLocaleString()}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-base font-extrabold text-indigo-600">${(item.totalStock || 0).toLocaleString()}</p>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">수량</p>
                            </div>
                        </div>
                    `).join('');

                    // 2. Chart.js 시각화 렌더링 (메모리 누수 방지 적용)
                    renderDashboardCharts(stats);

                    // 3. Recent Movements List (최근 5건만 노출)
                    const recentList = document.getElementById('recent-movements');
                    if (stats.recentMovements && stats.recentMovements.length > 0) {
                        recentList.innerHTML = stats.recentMovements.slice(0, 5).map(m => `
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl text-xs border border-gray-100 transition-all hover:bg-indigo-50">
                                <div>
                                    <p class="font-bold text-gray-800">${m.itemName}</p>
                                    <p class="text-[10px] text-gray-400 font-semibold">${m.warehouseName} | ${m.referenceNo || '-'}</p>
                                </div>
                                <div class="text-right">
                                    <span class="font-bold ${m.movementType.includes('OUT') ? 'text-red-500' : 'text-green-500'}">
                                        ${m.movementType.includes('OUT') ? '-' : '+'}${m.quantity.toLocaleString()}
                                    </span>
                                    <p class="text-[10px] text-gray-400 font-bold uppercase">${translateType(m.movementType)}</p>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        recentList.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">최근 변동 이력이 없습니다.</p>';
                    }
                }
            } catch (error) {
                // 상태별 분기 UX
                const isUnauthorized = error && (error.type === 'unauthorized' || error.status === 401);
                const isNetwork = error && error.type === 'network';

                if (!isUnauthorized) {
                    const msg = isNetwork
                        ? '네트워크 오류: 서버에 연결할 수 없습니다.'
                        : (error.message || '대시보드 데이터를 불러오지 못했습니다.');
                    if (window.ddukApi && window.ddukApi.showToast) {
                        window.ddukApi.showToast(msg, 'error');
                    }
                }

                // KPI 카드 에러 표시 (빈 칸 방지)
                ['total-qty','total-value','low-stock-count','pending-transfer-count','outbound-volume'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = '-';
                });
            }
        }

        function translateType(type) {
            const map = {
                'INBOUND': '입고(IN)',
                'OUTBOUND': '출고(OUT)',
                'TRANSFER_IN': '이동입고',
                'TRANSFER_OUT': '이동출고',
                'ADJUSTMENT_IN': '조정입고',
                'ADJUSTMENT_OUT': '조정출고'
            };
            return map[type] || type;
        }

        function renderDashboardCharts(stats) {
            // 기존 차트 안전 파괴 — canvas 재사용 시 warning 방지
            if (assetChartInstance) { assetChartInstance.destroy(); assetChartInstance = null; }
            if (trendChartInstance) { trendChartInstance.destroy(); trendChartInstance = null; }

            // canvas 요소가 없으면 skip
            const assetCanvas = document.getElementById('asset-ratio-chart');
            const trendCanvas = document.getElementById('outbound-trend-chart');
            if (!assetCanvas || !trendCanvas) return;

            // 1. 창고별 자산 비중 도넛 차트
            const whNames = stats.warehouseDistribution.map(w => w.warehouseName);
            const whValues = stats.warehouseDistribution.map(w => w.totalValue);

            const ctxAsset = assetCanvas.getContext('2d');
            assetChartInstance = new Chart(ctxAsset, {
                type: 'doughnut',
                data: {
                    labels: whNames.length > 0 ? whNames : ['보유 재고 없음'],
                    datasets: [{
                        data: whValues.length > 0 ? whValues : [0],
                        backgroundColor: [
                            'rgba(79, 70, 229, 0.8)',
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(245, 158, 11, 0.8)',
                            'rgba(239, 68, 68, 0.8)',
                            'rgba(107, 114, 128, 0.8)'
                        ],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
                    }
                }
            });

            // 2. 최근 30일 거래 추이 집계 (최근 변동 이력 데이터 기반 동적 집계)
            const dateStats = {};
            // 최근 7일 날짜를 뼈대로 잡고 수불로그에서 갯수를 카운팅
            for (let i = 29; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dStr = d.toISOString().split('T')[0];
                dateStats[dStr] = { inbound: 0, outbound: 0 };
            }

            if (stats.recentMovements) {
                stats.recentMovements.forEach(m => {
                    const dStr = m.createdAt.split('T')[0];
                    if (dateStats[dStr]) {
                        if (m.movementType.includes('IN') || m.movementType === 'INBOUND') {
                            dateStats[dStr].inbound += m.quantity;
                        } else {
                            dateStats[dStr].outbound += m.quantity;
                        }
                    }
                });
            }

            const dates = Object.keys(dateStats);
            const inData = dates.map(d => dateStats[d].inbound);
            const outData = dates.map(d => dateStats[d].outbound);
            const shortLabels = dates.map(d => d.substring(5)); // MM-DD

            const ctxTrend = trendCanvas.getContext('2d');
            trendChartInstance = new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: shortLabels,
                    datasets: [
                        {
                            label: '입고량(IN)',
                            data: inData,
                            borderColor: 'rgb(16, 185, 129)',
                            backgroundColor: 'rgba(16, 185, 129, 0.05)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 2
                        },
                        {
                            label: '출고량(OUT)',
                            data: outData,
                            borderColor: 'rgb(239, 68, 68)',
                            backgroundColor: 'rgba(239, 68, 68, 0.05)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { drawBorder: false } }
                    },
                    plugins: {
                        legend: { position: 'top', labels: { boxWidth: 12 } }
                    }
                }
            });
        }

        async function loadPendingTransfers() {
            const list = document.getElementById('pending-transfer-list');
            const empty = document.getElementById('pending-empty');
            if (list) list.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:1.5rem;color:#9ca3af;font-size:0.8rem">로딩 중...</td></tr>';

            try {
                const response = await InventoryService.getTransfers({ status: 'PENDING' });
                if (response.status === 'success' && response.data.length > 0) {
                    list.innerHTML = response.data.slice(0, 5).map(t => `
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
                            <td class="py-2.5 font-bold text-indigo-600">${t.transferNo}</td>
                            <td class="py-2.5 text-xs text-gray-600">${t.sourceWarehouseName} ➔ ${t.targetWarehouseName}</td>
                            <td class="py-2.5 text-gray-500">${t.requestedByName}</td>
                            <td class="py-2.5 text-center">
                                <button onclick="approveTransfer(${t.id})" class="px-2 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-md text-[10px] font-bold shadow-xs">승인</button>
                            </td>
                        </tr>
                    `).join('');
                    list.parentElement.classList.remove('hidden');
                    empty.classList.add('hidden');
                } else {
                    list.innerHTML = '';
                    list.parentElement.classList.add('hidden');
                    empty.classList.remove('hidden');
                }
                lucide.createIcons();
            } catch (error) {
                const isUnauthorized = error && (error.type === 'unauthorized' || error.status === 401);
                if (!isUnauthorized && window.ddukApi && window.ddukApi.showToast) {
                    window.ddukApi.showToast('창고 이동 목록을 불러오지 못했습니다.', 'warning');
                }
                if (empty) empty.classList.remove('hidden');
                if (list) list.innerHTML = '';
            }
        }

        async function approveTransfer(id) {
            if (!confirm('해당 창고 이동 요청을 승인하시겠습니까?')) return;
            try {
                const res = await InventoryService.approveTransfer(id);
                if (res.status === 'success') {
                    alert('승인되었습니다.');
                    await loadStats();
                    await loadPendingTransfers();
                } else {
                    alert('실패: ' + res.message);
                }
            } catch (error) {
                alert('오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
