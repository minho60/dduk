<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDUK ERP - 합계잔액시�  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../../../styles/common/dashboard.css">
  <link rel="stylesheet" href="../../../styles/common/erp_components.css">
  <link rel="stylesheet" href="../../../styles/accounting/trial-balance.css">
</head>
<body>
  <aside data-dduk-sidebar></aside>
  <div class="main_wrap">
    <header class="topbar">
      <button class="sidebar_icon_btn dduk-inline-027" onclick="toggleSidebar()" id="mobile_menu_btn" aria-label="메뉴">
        <i class="dduk-inline-028" data-lucide="menu"></i>
      </button>
      <div class="dduk-inline-029">
        <div class="dduk-inline-030">
          <i class="dduk-inline-031" data-lucide="search"></i>
          <input class="dduk-inline-032" type="text" placeholder="메뉴, 거래처, 문서 검색..." aria-label="검색">
        </div>
      </div>
      <div class="dduk-inline-033">
        <button class="sidebar_icon_btn" aria-label="알림"><i class="dduk-inline-034" data-lucide="bell"></i></button>
        <button class="sidebar_icon_btn" aria-label="프로필"><i class="dduk-inline-034" data-lucide="user"></i></button>
      </div>
    </header>

    <main class="content_area trial_page">
      <section class="page_header">
        <div class="page_title_area">
          <h2>합계잔액시산표</h2>
          <p>계정 계층과 회계 방향을 반영해 기초, 당기, 기말 잔액을 조회합니다.</p>
        </div>
      </section>

      <section class="filter_section">
        <div class="filter_grid">
          <div class="filter_field">
            <label for="startDate">시작일</label>
            <input id="startDate" type="date" class="erp_input" required>
          </div>
          <div class="filter_field">
            <label for="endDate">종료일</label>
            <input id="endDate" type="date" class="erp_input" required>
          </div>
          <div class="filter_field">
            <label for="reportBasis">조회 기준</label>
            <select id="reportBasis" class="erp_select">
              <option value="MONTHLY">월별</option>
              <option value="QUARTERLY">분기별</option>
              <option value="HALF_YEARLY">반기별</option>
              <option value="YEARLY">연도별</option>
            </select>
          </div>
          <div class="filter_field">
            <label for="accountLevel">계정 레벨</label>
            <select id="accountLevel" class="erp_select">
              <option value="ALL">전체</option>
              <option value="MAJOR">대분류</option>
              <option value="MIDDLE">중분류</option>
              <option value="SMALL">소분류</option>
              <option value="ACCOUNT">계정과목</option>
            </select>
          </div>
        </div>
        
        <div class="option_row" style="margin-top: 16px; display: flex; flex-wrap: wrap; gap: 16px;">
          <label class="erp_checkbox_label"><input id="includeZeroBalance" type="checkbox" class="erp_checkbox"> <span>잔액 없는 계정 포함</span></label>
          <label class="erp_checkbox_label"><input id="includeSubAccounts" type="checkbox" class="erp_checkbox" checked> <span>보조계정 포함</span></label>
          <label class="erp_checkbox_label"><input id="summaryOnly" type="checkbox" class="erp_checkbox"> <span>합계만 보기</span></label>
          <label class="erp_checkbox_label"><input id="profitLossFormat" type="checkbox" class="erp_checkbox"> <span>손익계산서 형식 보기</span></label>
        </div>

        <div class="action_row" style="margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px;">
          <button id="searchButton" type="button" class="erp_btn erp_btn_primary"><i data-lucide="search"></i><span>조회</span></button>
          <button id="expandAllButton" type="button" class="erp_btn erp_btn_secondary"><i data-lucide="list-tree"></i><span>전체 펼침</span></button>
          <button id="collapseAllButton" type="button" class="erp_btn erp_btn_secondary"><i data-lucide="fold-horizontal"></i><span>전체 접기</span></button>
          <button id="excelButton" type="button" class="erp_btn erp_btn_secondary"><i data-lucide="download"></i><span>Excel</span></button>
          <button id="printButton" type="button" class="erp_btn erp_btn_secondary"><i data-lucide="printer"></i><span>인쇄</span></button>
        </div>
      </section>

      <section class="kpi_grid" id="summaryCards">
        <div class="kpi_card">
          <div class="kpi_content">
            <div class="kpi_label">기초 차변</div>
            <div class="kpi_value" style="font-size: 1.25rem;" data-summary-money="openingDebitTotal">0</div>
          </div>
        </div>
        <div class="kpi_card">
          <div class="kpi_content">
            <div class="kpi_label">기초 대변</div>
            <div class="kpi_value" style="font-size: 1.25rem;" data-summary-money="openingCreditTotal">0</div>
          </div>
        </div>
        <div class="kpi_card">
          <div class="kpi_content">
            <div class="kpi_label">당기 차변</div>
            <div class="kpi_value" style="font-size: 1.25rem;" data-summary-money="periodDebitTotal">0</div>
          </div>
        </div>
        <div class="kpi_card">
          <div class="kpi_content">
            <div class="kpi_label">당기 대변</div>
            <div class="kpi_value" style="font-size: 1.25rem;" data-summary-money="periodCreditTotal">0</div>
          </div>
        </div>
        <div class="kpi_card">
          <div class="kpi_content">
            <div class="kpi_label">기말 차변</div>
            <div class="kpi_value" style="font-size: 1.25rem;" data-summary-money="closingDebitTotal">0</div>
          </div>
        </div>
        <div class="kpi_card">
          <div class="kpi_content">
            <div class="kpi_label">기말 대변</div>
            <div class="kpi_value" style="font-size: 1.25rem;" data-summary-money="closingCreditTotal">0</div>
          </div>
        </div>
        <div class="kpi_card">
          <div class="kpi_content">
            <div class="kpi_label">일치 여부</div>
            <div class="kpi_value" style="font-size: 1.125rem;" data-summary="balanceStatus">-</div>
          </div>
        </div>
      </section>

      <section class="section_card">
        <div class="section_card_header">
          <h3>시산표</h3>
          <span id="periodLabel" class="status_badge muted">-</span>
        </div>
        <div class="erp_table_container">
          <table class="erp_table">
            <thead>
              <tr>
                <th style="width: 100px;">계정코드</th>
                <th>계정명</th>
                <th class="amount">기초잔액(차변)</th>
                <th class="amount">기초잔액(대변)</th>
                <th class="amount">당기합계(차변)</th>
                <th class="amount">당기합계(대변)</th>
                <th class="amount">기말잔액(차변)</th>
                <th class="amount">기말잔액(대변)</th>
              </tr>
            </thead>
            <tbody id="trialTableBody"></tbody>
            <tfoot id="trialTableFoot"></tfoot>
          </table>
        </div>
      </section>�기합계(차변)</th>
                <th class="amount">당기합계(대변)</th>
                <th class="amount">기말잔액(차변)</th>
                <th class="amount">기말잔액(대변)</th>
              </tr>
            </thead>
            <tbody id="trialTableBody"></tbody>
            <tfoot id="trialTableFoot"></tfoot>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../../../services/common/sidebar.js"></script>
  <script src="../../../assets/js/accounting/trial_balance.js"></script>
</body>
</html>
