<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDUK ERP - 회계 리포트</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../../../styles/common/app-shell.css">
    <link rel="stylesheet" href="../../../styles/common/dashboard.css">
    <link rel="stylesheet" href="../../../styles/hr/hr-backend-pages.css">
    <style>
        .status-positive { color: #28a745; }
        .status-negative { color: #dc3545; }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast {
            padding: 12px 20px;
            margin-bottom: 10px;
            border-radius: 4px;
            color: white;
            animation: slideIn 0.3s ease-out;
        }
        .toast-success { background: #28a745; }
        .toast-error { background: #dc3545; }
        .toast-info { background: #17a2b8; }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body data-hr-page="accounting-reports">
    <aside data-dduk-sidebar></aside>
    <div class="main_wrap">
        <main class="app-main hr_page">
            <header class="hr_topbar">
                <button class="sidebar_icon_btn dduk-inline-027" onclick="toggleSidebar()" id="mobile_menu_btn" aria-label="메뉴">
                    <i class="dduk-inline-028" data-lucide="menu"></i>
                </button>
                <div class="hr_title">
                    <h2>회계 리포트</h2>
                    <p>기간별 시산표, 손익계산서, 재무상태표를 조회한다.</p>
                </div>
                <div class="hr_actions">
                    <button class="hr_button" id="btn_refresh_reports" type="button"><i data-lucide="refresh-cw"></i>새로고침</button>
                </div>
            </header>

            <section class="hr_grid">
                <article class="hr_card span_12">
                    <div class="hr_card_header">
                        <h3>기간 필터</h3>
                    </div>
                    <div class="hr_form_grid" style="grid-template-columns: repeat(4, 1fr); gap: 16px;">
                        <div class="hr_field">
                            <label for="filter_year">회계연도</label>
                            <select class="hr_input" id="filter_year">
                                <option value="">전체</option>
                                <option value="2026">2026</option>
                                <option value="2025">2025</option>
                                <option value="2024">2024</option>
                            </select>
                        </div>
                        <div class="hr_field">
                            <label for="filter_month">회계월</label>
                            <select class="hr_input" id="filter_month">
                                <option value="">전체</option>
                                <option value="1">1월</option>
                                <option value="2">2월</option>
                                <option value="3">3월</option>
                                <option value="4">4월</option>
                                <option value="5">5월</option>
                                <option value="6">6월</option>
                                <option value="7">7월</option>
                                <option value="8">8월</option>
                                <option value="9">9월</option>
                                <option value="10">10월</option>
                                <option value="11">11월</option>
                                <option value="12">12월</option>
                            </select>
                        </div>
                        <div class="hr_field">
                            <label for="report_type">리포트 유형</label>
                            <select class="hr_input" id="report_type">
                                <option value="trial-balance">시산표</option>
                                <option value="profit-loss">손익계산서</option>
                                <option value="balance-sheet">재무상태표</option>
                            </select>
                        </div>
                        <div class="hr_field" style="display: flex; align-items: flex-end;">
                            <button class="hr_button primary" id="btn_apply_filter" type="button" style="width: 100%;">
                                <i data-lucide="search"></i>조회
                            </button>
                        </div>
                    </div>
                </article>

                <article class="hr_card span_3">
                    <div class="hr_kpi_label">총 자산/차변</div>
                    <div class="hr_kpi_value" id="kpi_total_assets">-</div>
                    <div class="hr_kpi_hint">조회 기준 합계</div>
                </article>
                <article class="hr_card span_3">
                    <div class="hr_kpi_label">총 부채/대변</div>
                    <div class="hr_kpi_value" id="kpi_total_liabilities">-</div>
                    <div class="hr_kpi_hint">조회 기준 합계</div>
                </article>
                <article class="hr_card span_3">
                    <div class="hr_kpi_label">손익/차액</div>
                    <div class="hr_kpi_value" id="kpi_net_income">-</div>
                    <div class="hr_kpi_hint" id="net_income_status">-</div>
                </article>
                <article class="hr_card span_3">
                    <div class="hr_kpi_label">총 매출</div>
                    <div class="hr_kpi_value" id="kpi_total_revenue">-</div>
                    <div class="hr_kpi_hint">손익계산서 기준</div>
                </article>

                <article class="hr_card span_12">
                    <div class="hr_card_header">
                        <h3 id="report_title">시산표</h3>
                        <span class="hr_badge" id="report_badge">Trial Balance</span>
                    </div>
                    <div id="report_table_container">
                        <table class="hr_table">
                            <thead>
                                <tr>
                                    <th>계정코드</th>
                                    <th>계정명</th>
                                    <th>구분</th>
                                    <th class="amount">차변 합계</th>
                                    <th class="amount">대변 합계</th>
                                    <th class="amount">잔액</th>
                                </tr>
                            </thead>
                            <tbody id="report_rows"></tbody>
                            <tfoot>
                                <tr style="background: #f8f9fa; font-weight: bold;">
                                    <td colspan="3" style="text-align: center;">합계</td>
                                    <td class="amount" id="total_debit">0</td>
                                    <td class="amount" id="total_credit">0</td>
                                    <td class="amount" id="total_balance">0</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <div id="empty_state" class="empty-state" style="display: none;">
                        <p>조회된 데이터가 없다.</p>
                    </div>
                </article>

                <article class="hr_card span_4">
                    <div class="hr_card_header">
                        <h3>매출</h3>
                        <span class="hr_badge" style="background: #e3f2fd; color: #1976d2;">Revenue</span>
                    </div>
                    <div class="hr_kpi_value" id="summary_revenue">-</div>
                    <div class="hr_kpi_hint">총 매출액</div>
                </article>
                <article class="hr_card span_4">
                    <div class="hr_card_header">
                        <h3>비용</h3>
                        <span class="hr_badge" style="background: #ffebee; color: #d32f2f;">Expense</span>
                    </div>
                    <div class="hr_kpi_value" id="summary_expenses">-</div>
                    <div class="hr_kpi_hint">총 비용액</div>
                </article>
                <article class="hr_card span_4">
                    <div class="hr_card_header">
                        <h3>요약</h3>
                        <span class="hr_badge" id="operating_income_badge">-</span>
                    </div>
                    <div class="hr_kpi_value" id="summary_operating_income">-</div>
                    <div class="hr_kpi_hint">선택 리포트 기준</div>
                </article>
            </section>
        </main>
    </div>

    <div class="toast-container" id="toast_container"></div>
    <div class="loading-overlay" id="loading_overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="../../../services/common/session.js"></script>
    <script src="../../../services/common/app-shell.js"></script>
    <script src="../../../services/common/sidebar.js"></script>
    <script type="module" src="../../../services/hr/hr-backend-pages.js"></script>
</body>
</html>
