<div class="hr_card" id="voucher_management_card">
  <div class="hr_card_header">
    <h3>전표 입력 (매출 / 매입)</h3>
  </div>
  <form id="voucherForm">
    <div class="form-row" style="display: flex; gap: 20px; margin-bottom: 15px;">
      <div class="form-group" style="flex: 1;">
        <label>전표 유형</label>
        <select id="voucherType" class="hr_input hr_select" required>
          <option value="SALES">매출전표</option>
          <option value="PURCHASE">매입전표</option>
        </select>
      </div>
      <div class="form-group" style="flex: 1;">
        <label>전표 일자</label>
        <input type="date" id="voucherDate" class="hr_input" required>
      </div>
      <div class="form-group" style="flex: 1;">
        <label>부가세 유형</label>
        <select id="vatType" class="hr_input hr_select" required>
          <option value="TAX_INVOICE">세금계산서</option>
          <option value="CARD_SALES">카드매출</option>
          <option value="CASH_RECEIPT">현금영수증</option>
          <option value="TAX_FREE">면세</option>
        </select>
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
      <label>거래처 (Vendor)</label>
      <input type="text" id="vendorName" class="hr_input" placeholder="거래처명 입력" required>
      <!-- Hidden ID (can be mapped via search later) -->
      <input type="hidden" id="vendorId" value="1"> 
    </div>

    <h3 style="margin: 20px 0 10px; font-size: 1.1rem;">전표 라인 (Voucher Lines)</h3>
    <div style="overflow-x: auto; margin-bottom: 15px;">
      <table class="transactions-table" id="voucherLinesTable">
        <thead>
          <tr>
            <th>계정과목</th>
            <th>차대구분</th>
            <th>공급가액</th>
            <th>부가세</th>
            <th>합계금액</th>
            <th>적요</th>
            <th>작업</th>
          </tr>
        </thead>
        <tbody id="voucherLinesBody">
          <!-- Lines will be dynamically added here -->
        </tbody>
      </table>
    </div>
    
    <div style="display: flex; gap: 10px; align-items: center; justify-content: space-between;">
      <button type="button" class="btn-cancel" id="btn_add_voucher_line">+ 라인 추가</button>
      <div id="voucher_balance_display" style="font-weight: bold; color: #666;">차변 0 - 대변 0</div>
    </div>

    <div class="form-actions" style="margin-top: 20px;">
      <button type="button" class="btn-cancel" onclick="document.getElementById('voucher_management_card').style.display='none'">취소</button>
      <button type="submit" class="btn-submit" id="btn_submit_voucher">저장 (기표)</button>
    </div>
  </form>
</div>
