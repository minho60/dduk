<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발주요청 | DDUK ERP</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../../styles/common/dashboard.css">
    <style>
        .form-label{display:block;margin-bottom:.5rem;font-size:.875rem;font-weight:600;color:#374151}
        .form-input,.form-select,.form-textarea{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.75rem 1rem;font-size:.875rem;color:#111827;background:#fff}
        .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
        .form-textarea{min-height:96px;resize:vertical}.selected-box{border:1px dashed #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:.75rem;padding:.875rem 1rem;font-size:.875rem;font-weight:700}
        .data-table{width:100%;border-collapse:separate;border-spacing:0}.data-table th{background:#f9fafb;padding:.75rem;text-align:left;font-size:.75rem;font-weight:700;color:#6b7280;border-bottom:1px solid #e5e7eb}.data-table td{padding:.75rem;font-size:.875rem;color:#374151;border-bottom:1px solid #f3f4f6;vertical-align:middle}
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <aside data-dduk-sidebar></aside>
    <div class="main_wrap">
        <header class="topbar px-6 py-4 flex justify-between items-center bg-white border-b sticky top-0 z-10">
            <div class="flex items-center gap-4"><button id="mobile_menu_btn" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu"></i></button><h1 class="text-xl font-bold text-gray-800">발주요청</h1></div>
            <button type="button" id="btn-save" class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 flex items-center gap-2"><i data-lucide="send" class="w-4 h-4"></i> 발주요청 저장</button>
        </header>
        <main class="content_area p-6 max-w-7xl mx-auto">
            <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                <div class="p-6 border-b border-gray-100"><h2 class="text-lg font-semibold text-gray-800">발주 기본 정보</h2><p class="text-sm text-gray-500 mt-1">거래처와 납기일을 지정한 뒤 발주 품목을 추가합니다.</p></div>
                <div class="p-6 grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_220px_220px] gap-5">
                    <div><label class="form-label">거래처 검색</label><div class="flex gap-2"><input id="vendor-name" class="form-input" placeholder="거래처명을 입력하세요"><button id="btn-vendor-search" type="button" class="shrink-0 px-4 rounded-lg bg-gray-900 text-sm font-semibold text-white">검색</button></div><input id="vendor-id" type="hidden"><div id="selected-vendor" class="selected-box mt-3">선택된 거래처가 없습니다.</div></div>
                    <label><span class="form-label">희망 납기일</span><input id="expected-date" type="date" class="form-input" required></label>
                    <label><span class="form-label">승인자</span><select id="approved-by-member-id" class="form-select" required><option value="1">admin</option><option value="3">hr</option></select></label>
                    <label class="lg:col-span-3"><span class="form-label">요청 메모</span><textarea id="order-note" class="form-textarea"></textarea></label>
                </div>
            </section>
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
                <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"><div class="p-6 border-b border-gray-100"><h2 class="text-lg font-semibold text-gray-800">거래처 검색 결과</h2></div><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>거래처 코드</th><th>거래처명</th><th>대표자명</th><th>전화번호</th><th>선택</th></tr></thead><tbody id="vendor-result"><tr><td colspan="5" class="text-center text-gray-400 font-semibold py-7">거래처명을 검색하세요.</td></tr></tbody></table></div></section>
                <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"><div class="p-6 border-b border-gray-100"><h2 class="text-lg font-semibold text-gray-800">품목 검색</h2><div class="flex gap-2 mt-4"><input id="item-name" class="form-input" placeholder="품목명을 입력하세요"><button id="btn-item-search" type="button" class="shrink-0 px-4 rounded-lg bg-gray-900 text-sm font-semibold text-white">검색</button></div></div><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>품목 코드</th><th>품목명</th><th>단위</th><th>단가</th><th>추가</th></tr></thead><tbody id="item-result"><tr><td colspan="5" class="text-center text-gray-400 font-semibold py-7">품목명을 검색하세요.</td></tr></tbody></table></div></section>
            </div>
            <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"><div class="p-6 border-b border-gray-100"><h2 class="text-lg font-semibold text-gray-800">발주 품목</h2><p id="message" class="text-sm text-gray-500 mt-1">품목을 추가하면 발주 요청을 저장할 수 있습니다.</p></div><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>품목</th><th>수량</th><th>단가</th><th>공급가액</th><th>부가세</th><th>합계</th><th>삭제</th></tr></thead><tbody id="order-items"><tr><td colspan="7" class="text-center text-gray-400 font-semibold py-8">추가된 품목이 없습니다.</td></tr></tbody></table></div></section>
        </main>
    </div>
    <script src="../../services/common/sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(window.lucide) lucide.createIcons();
            const TAX_RATE=.1, apiOrigin=location.protocol==='file:'?'http://localhost:8080':location.origin;
            const vendorResult=document.getElementById('vendor-result'), itemResult=document.getElementById('item-result'), orderBody=document.getElementById('order-items'), msg=document.getElementById('message'), saveBtn=document.getElementById('btn-save'), selectedBox=document.getElementById('selected-vendor');
            let selectedVendor=null, orderItems=[];
            function headers(json=false){const t=localStorage.getItem('token');const h=json?{'Content-Type':'application/json'}:{};if(t)h.Authorization=`Bearer ${t}`;return h}
            async function readError(r){const t=await r.text();if(!t)return`HTTP ${r.status}`;try{const j=JSON.parse(t);return j.message||j.error||t}catch{return t}}
            function text(v){return v==null||v===''?'-':v} function money(v){return Number(v||0).toLocaleString('ko-KR',{maximumFractionDigits:2})}
            function setMsg(t,type='info'){msg.className=`text-sm mt-1 font-semibold ${type==='error'?'text-red-600':type==='ok'?'text-emerald-600':'text-gray-500'}`;msg.textContent=t}
            function addItem(item){const ex=orderItems.find(x=>x.itemId===item.id);if(ex)ex.quantity+=1;else orderItems.push({itemId:item.id,itemCode:item.itemCode,name:item.name,unit:item.unit,quantity:1,unitPrice:Number(item.unitPrice||0)});renderOrder();setMsg(`${text(item.name)} 품목이 추가되었습니다.`,'ok')}
            function renderVendors(list){if(!list.length){vendorResult.innerHTML='<tr><td colspan="5" class="text-center text-gray-400 font-semibold py-7">조회된 거래처가 없습니다.</td></tr>';return}vendorResult.innerHTML=list.map(v=>`<tr><td class="font-bold">${text(v.vendorCode)}</td><td>${text(v.name)}</td><td>${text(v.representativeName)}</td><td>${text(v.contactPhone)}</td><td><button type="button" class="select-vendor px-3 py-2 text-xs font-bold rounded-lg bg-indigo-50 text-indigo-700" data-id="${v.id}">선택</button></td></tr>`).join('');vendorResult.querySelectorAll('.select-vendor').forEach(b=>b.onclick=()=>{selectedVendor=list.find(v=>String(v.id)===b.dataset.id);document.getElementById('vendor-id').value=selectedVendor.id;selectedBox.textContent=`${selectedVendor.vendorCode} / ${selectedVendor.name} / ${selectedVendor.businessRegistrationNo}`})}
            function renderItems(list){if(!list.length){itemResult.innerHTML='<tr><td colspan="5" class="text-center py-7"><p class="font-semibold text-gray-400">조회된 품목이 없습니다.</p><button type="button" id="btn-open-item-register" class="mt-3 px-4 py-2 text-sm font-bold rounded-lg bg-indigo-50 text-indigo-700">새 품목 등록</button></td></tr>';document.getElementById('btn-open-item-register').onclick=openItemPopup;return}itemResult.innerHTML=list.map(i=>`<tr><td class="font-bold">${text(i.itemCode)}</td><td>${text(i.name)}</td><td>${text(i.unit)}</td><td>${money(i.unitPrice)}</td><td><button type="button" class="add-item px-3 py-2 text-xs font-bold rounded-lg bg-indigo-50 text-indigo-700" data-id="${i.id}">추가</button></td></tr>`).join('');itemResult.querySelectorAll('.add-item').forEach(b=>b.onclick=()=>addItem(list.find(i=>String(i.id)===b.dataset.id)))}
            function renderOrder(){if(!orderItems.length){orderBody.innerHTML='<tr><td colspan="7" class="text-center text-gray-400 font-semibold py-8">추가된 품목이 없습니다.</td></tr>';return}orderBody.innerHTML=orderItems.map((i,idx)=>{const supply=i.quantity*i.unitPrice,tax=supply*TAX_RATE,total=supply+tax;return`<tr><td><p class="font-bold">${text(i.name)}</p><p class="text-xs text-gray-400">${text(i.itemCode)} / ${text(i.unit)}</p></td><td><input type="number" min="1" step="1" class="form-input qty" data-idx="${idx}" value="${i.quantity}"></td><td><input type="number" min="0" step="0.01" class="form-input price" data-idx="${idx}" value="${i.unitPrice}"></td><td>${money(supply)}</td><td>${money(tax)}</td><td class="font-bold">${money(total)}</td><td><button type="button" class="remove px-3 py-2 text-xs font-bold rounded-lg bg-red-50 text-red-600" data-idx="${idx}">삭제</button></td></tr>`}).join('');orderBody.querySelectorAll('.qty').forEach(i=>i.onchange=()=>{orderItems[Number(i.dataset.idx)].quantity=Math.max(1,Number(i.value||1));renderOrder()});orderBody.querySelectorAll('.price').forEach(i=>i.onchange=()=>{orderItems[Number(i.dataset.idx)].unitPrice=Math.max(0,Number(i.value||0));renderOrder()});orderBody.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{orderItems.splice(Number(b.dataset.idx),1);renderOrder()})}
            function openItemPopup(){const p=new URLSearchParams({vendorId:selectedVendor?selectedVendor.id:'',vendorName:selectedVendor?selectedVendor.name:'',name:document.getElementById('item-name').value.trim()});const w=window.open(`item-register-popup.html?${p}`,'ddukItemRegister','width=760,height=780,menubar=no,toolbar=no,location=no,status=no');if(!w)setMsg('팝업이 차단되었습니다.','error')}
            async function searchVendors(){const name=document.getElementById('vendor-name').value.trim();const url=new URL(`${apiOrigin}/api/v1/inventory/vendors/search`);if(name)url.searchParams.set('name',name);vendorResult.innerHTML='<tr><td colspan="5" class="text-center text-gray-400 font-semibold py-7">조회 중입니다.</td></tr>';try{const r=await fetch(url,{headers:headers()});if(!r.ok)throw new Error(await readError(r));renderVendors(await r.json())}catch(e){vendorResult.innerHTML=`<tr><td colspan="5" class="text-center text-red-600 font-semibold py-7">거래처 조회 실패: ${e.message}</td></tr>`}}
            async function searchItems(){const name=document.getElementById('item-name').value.trim();const url=new URL(`${apiOrigin}/api/v1/inventory/items/search`);if(name)url.searchParams.set('name',name);itemResult.innerHTML='<tr><td colspan="5" class="text-center text-gray-400 font-semibold py-7">조회 중입니다.</td></tr>';try{const r=await fetch(url,{headers:headers()});if(!r.ok)throw new Error(await readError(r));const items=await r.json();renderItems(items);if(!items.length)openItemPopup()}catch(e){itemResult.innerHTML=`<tr><td colspan="5" class="text-center text-red-600 font-semibold py-7">품목 조회 실패: ${e.message}</td></tr>`}}
            async function save(){if(!selectedVendor){setMsg('거래처를 선택하세요.','error');return}const expectedDate=document.getElementById('expected-date').value;if(!expectedDate){setMsg('희망 납기일을 입력하세요.','error');return}if(!orderItems.length){setMsg('발주 품목을 추가하세요.','error');return}const payload={vendorId:selectedVendor.id,approvedByMemberId:Number(document.getElementById('approved-by-member-id').value),expectedDate,note:document.getElementById('order-note').value.trim(),items:orderItems.map(i=>({itemId:i.itemId,quantity:i.quantity,unitPrice:i.unitPrice,expectedDate,note:''}))};const original=saveBtn.innerHTML;saveBtn.disabled=true;saveBtn.innerHTML='저장 중...';try{const r=await fetch(`${apiOrigin}/api/v1/inventory/purchase-orders`,{method:'POST',headers:headers(true),body:JSON.stringify(payload)});if(!r.ok)throw new Error(await readError(r));const saved=await r.json();setMsg(`발주요청이 저장되었습니다. 발주번호: ${saved.purchaseOrderNo||'-'}`,'ok');orderItems=[];renderOrder()}catch(e){setMsg(`발주요청 저장 실패: ${e.message}`,'error')}finally{saveBtn.disabled=false;saveBtn.innerHTML=original;if(window.lucide)lucide.createIcons()}}
            window.ddukPurchaseRequest={addCreatedItem:addItem};window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='DDUK_ITEM_CREATED'&&e.data.item)addItem(e.data.item)});
            document.getElementById('btn-vendor-search').onclick=searchVendors;document.getElementById('btn-item-search').onclick=searchItems;saveBtn.onclick=save;document.getElementById('vendor-name').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchVendors()}};document.getElementById('item-name').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchItems()}};
        });
    </script>
</body>
</html>
