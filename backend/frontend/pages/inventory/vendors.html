<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래처 조회 | DDUK ERP</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../../styles/common/dashboard.css">
    <style>
        .form-label{display:block;margin-bottom:.5rem;font-size:.875rem;font-weight:600;color:#374151}
        .form-input,.form-textarea{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.75rem 1rem;font-size:.875rem;color:#111827;background:#fff}
        .form-input:disabled,.form-textarea:disabled{background:#f9fafb;color:#6b7280;cursor:not-allowed}
        .form-input:focus,.form-textarea:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
        .form-textarea{min-height:96px;resize:vertical}
        .data-table{width:100%;border-collapse:separate;border-spacing:0}
        .data-table th{background:#f9fafb;padding:.75rem;text-align:left;font-size:.75rem;font-weight:700;color:#6b7280;border-bottom:1px solid #e5e7eb}
        .data-table td{padding:.75rem;font-size:.875rem;color:#374151;border-bottom:1px solid #f3f4f6}
        .data-table tr[data-id]{cursor:pointer}.data-table tr[data-id]:hover{background:#f9fafb}.data-table tr.selected{background:#eef2ff}
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <aside data-dduk-sidebar></aside>
    <div class="main_wrap">
        <header class="topbar px-6 py-4 flex justify-between items-center bg-white border-b sticky top-0 z-10">
            <div class="flex items-center gap-4"><button id="mobile_menu_btn" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu"></i></button><h1 class="text-xl font-bold text-gray-800">거래처 조회</h1></div>
            <button type="button" onclick="location.href='vendors-register.html'" class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> 거래처 등록</button>
        </header>
        <main class="content_area p-6">
            <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-4 xl:grid-cols-[repeat(4,minmax(0,1fr))_auto] gap-3 items-end">
                    <label><span class="form-label">거래처명</span><input id="search-name" class="form-input"></label>
                    <label><span class="form-label">대표자명</span><input id="search-representative" class="form-input"></label>
                    <label><span class="form-label">전화번호</span><input id="search-phone" class="form-input"></label>
                    <label><span class="form-label">사업자등록번호</span><input id="search-registration-no" class="form-input"></label>
                    <div class="flex gap-2"><button id="btn-search" type="button" class="h-11 px-4 rounded-lg bg-gray-900 text-sm font-semibold text-white">조회</button><button id="btn-reset" type="button" class="h-11 px-4 rounded-lg border border-gray-300 bg-white text-sm font-semibold text-gray-700">초기화</button></div>
                </div>
            </section>
            <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_480px] gap-6">
                <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-6 border-b border-gray-100"><h2 class="text-lg font-semibold text-gray-800">거래처 목록</h2><p id="list-status" class="text-sm text-gray-500 mt-1">검색 조건을 입력한 뒤 조회 버튼을 눌러주세요.</p></div>
                    <div class="overflow-x-auto"><table class="data-table"><thead><tr><th>거래처 코드</th><th>거래처명</th><th>대표자명</th><th>사업자등록번호</th><th>담당자</th><th>전화번호</th><th>상태</th></tr></thead><tbody id="vendor-list"></tbody></table></div>
                </section>
                <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex justify-between gap-3"><div><h2 class="text-lg font-semibold text-gray-800">상세 정보</h2><p id="detail-status" class="text-sm text-gray-500 mt-1">목록에서 거래처를 선택하세요.</p></div><div class="flex gap-2"><button id="btn-edit" type="button" class="hidden px-3 py-2 text-sm font-semibold rounded-lg border bg-white">수정</button><button id="btn-cancel" type="button" class="hidden px-3 py-2 text-sm font-semibold rounded-lg border bg-white">취소</button><button id="btn-save" type="button" class="hidden px-3 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white">저장</button></div></div>
                    <form id="detail-form" class="p-6 hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                        <label><span class="form-label">거래처 코드</span><input id="vendorCode" class="form-input" disabled data-immutable></label>
                        <label><span class="form-label">상태</span><input id="status" class="form-input" disabled></label>
                        <label><span class="form-label">거래처명</span><input id="name" class="form-input" disabled data-immutable></label>
                        <label><span class="form-label">대표자명</span><input id="representativeName" class="form-input" disabled data-immutable></label>
                        <label><span class="form-label">사업자등록번호</span><input id="businessRegistrationNo" class="form-input" disabled data-immutable></label>
                        <label><span class="form-label">업태</span><input id="businessType" class="form-input" disabled data-immutable></label>
                        <label><span class="form-label">종목</span><input id="businessItem" class="form-input" disabled data-immutable></label>
                        <label><span class="form-label">담당자명</span><input id="contactName" class="form-input" required></label>
                        <label><span class="form-label">전화번호</span><input id="contactPhone" class="form-input" required></label>
                        <label><span class="form-label">이메일</span><input id="email" type="email" class="form-input" required></label>
                        <label class="md:col-span-2"><span class="form-label">주소</span><input id="address" class="form-input" required></label>
                        <label><span class="form-label">은행명</span><input id="bankName" class="form-input" required></label>
                        <label><span class="form-label">계좌번호</span><input id="bankAccountNo" class="form-input" required></label>
                        <label><span class="form-label">예금주</span><input id="bankAccountHolder" class="form-input" required></label>
                        <label class="md:col-span-2"><span class="form-label">비고</span><textarea id="memo" class="form-textarea"></textarea></label>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script src="../../services/common/sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            const apiOrigin = window.location.protocol === 'file:' ? 'http://localhost:8080' : window.location.origin;
            const api = `${apiOrigin}/api/v1/inventory/vendors`;
            const list = document.getElementById('vendor-list'), listStatus = document.getElementById('list-status'), detailStatus = document.getElementById('detail-status'), form = document.getElementById('detail-form');
            const editBtn = document.getElementById('btn-edit'), cancelBtn = document.getElementById('btn-cancel'), saveBtn = document.getElementById('btn-save');
            const fields = ['vendorCode','status','name','representativeName','businessRegistrationNo','businessType','businessItem','contactName','contactPhone','email','address','bankName','bankAccountNo','bankAccountHolder','memo'];
            let vendors = [], current = null;
            function headers(json=false){const t=localStorage.getItem('token');const h=json?{'Content-Type':'application/json'}:{};if(t)h.Authorization=`Bearer ${t}`;return h}
            async function readError(r){const t=await r.text();if(!t)return`HTTP ${r.status}`;try{const j=JSON.parse(t);return j.message||j.error||t}catch{return t}}
            function text(v){return v==null||v===''?'-':v}
            function renderList(emptyText='조회 버튼을 누르면 거래처 목록이 표시됩니다.'){if(!vendors.length){list.innerHTML=`<tr><td colspan="7" class="text-center text-gray-400 font-semibold py-8">${emptyText}</td></tr>`;return}list.innerHTML=vendors.map(v=>`<tr data-id="${v.id}" class="${current&&current.id===v.id?'selected':''}"><td class="font-bold">${text(v.vendorCode)}</td><td>${text(v.name)}</td><td>${text(v.representativeName)}</td><td>${text(v.businessRegistrationNo)}</td><td>${text(v.contactName)}</td><td>${text(v.contactPhone)}</td><td>${text(v.status)}</td></tr>`).join('');list.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>loadVendor(r.dataset.id));listStatus.textContent=`${vendors.length}건이 조회되었습니다.`}
            function setMode(edit){form.querySelectorAll('input,textarea').forEach(i=>i.disabled=i.dataset.immutable!==undefined||['vendorCode','status'].includes(i.id)||!edit);editBtn.classList.toggle('hidden',edit||!current);cancelBtn.classList.toggle('hidden',!edit);saveBtn.classList.toggle('hidden',!edit)}
            function fill(v){current=v;fields.forEach(f=>document.getElementById(f).value=v[f]||'');form.classList.remove('hidden');detailStatus.textContent=`${text(v.vendorCode)} 정보를 불러왔습니다.`;setMode(false);renderList()}
            function searchUrl(){const p=new URLSearchParams();[['name','search-name'],['representativeName','search-representative'],['contactPhone','search-phone'],['businessRegistrationNo','search-registration-no']].forEach(([k,id])=>{const v=document.getElementById(id).value.trim();if(v)p.set(k,v)});return`${api}/search${p.toString()?`?${p}`:''}`}
            async function search(){listStatus.textContent='조회 중입니다.';try{const r=await fetch(searchUrl(),{headers:headers()});if(!r.ok)throw new Error(await readError(r));vendors=await r.json();renderList('조회된 거래처가 없습니다.')}catch(e){vendors=[];renderList('조회 실패');listStatus.textContent=`거래처 조회 실패: ${e.message}`}}
            async function loadVendor(id){try{const r=await fetch(`${api}/${encodeURIComponent(id)}`,{headers:headers()});if(!r.ok)throw new Error(await readError(r));fill(await r.json())}catch(e){detailStatus.textContent=`상세 조회 실패: ${e.message}`}}
            async function save(){if(!form.checkValidity()){form.reportValidity();return}const payload={businessRegistrationNo:current.businessRegistrationNo,name:current.name,representativeName:current.representativeName,businessType:current.businessType,businessItem:current.businessItem,contactName:contactName.value.trim(),contactPhone:contactPhone.value.trim(),email:email.value.trim(),address:address.value.trim(),bankName:bankName.value.trim(),bankAccountNo:bankAccountNo.value.trim(),bankAccountHolder:bankAccountHolder.value.trim(),memo:memo.value.trim()};try{const r=await fetch(`${api}/${current.id}`,{method:'PATCH',headers:headers(true),body:JSON.stringify(payload)});if(!r.ok)throw new Error(await readError(r));const v=await r.json();vendors=vendors.map(x=>x.id===v.id?v:x);fill(v);detailStatus.textContent='거래처 정보가 수정되었습니다.'}catch(e){detailStatus.textContent=`수정 실패: ${e.message}`}}
            function clear(){vendors=[];current=null;form.classList.add('hidden');editBtn.classList.add('hidden');cancelBtn.classList.add('hidden');saveBtn.classList.add('hidden');listStatus.textContent='검색 조건을 입력한 뒤 조회 버튼을 눌러주세요.';detailStatus.textContent='목록에서 거래처를 선택하세요.';renderList()}
            document.getElementById('btn-search').onclick=search;document.getElementById('btn-reset').onclick=clear;editBtn.onclick=()=>setMode(true);cancelBtn.onclick=()=>fill(current);saveBtn.onclick=save;
            const initial = new URLSearchParams(location.search).get('vendorId'); if(initial) loadVendor(initial); else clear();
        });
    </script>
</body>
</html>
