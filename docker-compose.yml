version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dduk-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mysql://db:3306/dduk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=dduk_user
      - DB_PASSWORD=dduk_password
      - JWT_SECRET=your_very_long_and_secure_jwt_secret_key_for_dduk_erp
      - JPA_DDL_AUTO=update
      - SQL_INIT_MODE=always
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dduk-frontend
    ports:
      - "80:80"
    environment:
      - PORT=80
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: dduk-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=dduk
      - MYSQL_USER=dduk_user
      - MYSQL_PASSWORD=dduk_password
      - MYSQL_ROOT_PASSWORD=dduk_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
